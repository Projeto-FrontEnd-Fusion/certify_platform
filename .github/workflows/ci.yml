name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_API_URL: http://127.0.0.1:8000/api/v1

jobs:
  validate:
    name: Lint, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint without warnings
        run: npm run lint -- --max-warnings 0
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level high
      - name: Typecheck and production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test critical user flows
        run: npm run test:e2e
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-tests
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Upload validated frontend build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  ci:
    name: Frontend CI passed
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all gates
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = success
